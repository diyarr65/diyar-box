name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # v3 yerine v4 yaptık

      - name: Set up Java
        uses: actions/setup-java@v4 # v3 yerine v4 yaptık
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5 # v4 yerine v5 yaptık
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet yt-dlp
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4 # HATANIN ANA SEBEBİ BURASIYDI, v4 yaptık
        with:
          name: my-app-apk
          path: build/apk/*.apk
